[project]
name = "stapply-backend"
version = "0.1.0"
description = "stAPPly — agenti che rispondono sui tuoi documenti (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "python-dotenv",
    "openai",
    "openai-agents==0.22.3",
    "chromadb",
    "numpy",
    "pypdf",
    "python-docx",
    "beautifulsoup4",
    "markdown-it-py",
    "openpyxl",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.17.3",
]

[tool.uv]
# chromadb dipende da onnxruntime, che dalla 1.24 non pubblica più wheel per i Mac Intel:
# così uv sceglie una versione installabile anche lì (e il lock resta valido su Linux, per la CI).
required-environments = ["sys_platform == 'darwin' and platform_machine == 'x86_64'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
